<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UCL Rakip Gücü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b1f;--panel:#0f1533;--panel2:#161e45;--line:#26306a;--text:#e9ecff;--mute:#8d96c7;
--acc:#3d7bff;--acc2:#00d1ff;--gold:#ffc940;--win:#22c55e;--draw:#94a3b8;--loss:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#1b2a7a 0%,transparent 60%),var(--bg);
color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
h1{margin:0;font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;color:transparent}
.sub{color:var(--mute);margin-top:6px;max-width:640px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:96px}
.stat b{display:block;font-size:20px}.stat small{color:var(--mute)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:var(--mute);padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit;font-weight:600}
.seg button.on{background:var(--acc);color:#fff}
input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;flex:1;min-width:160px;max-width:260px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.card{min-width:0;background:linear-gradient(180deg,var(--panel),#0c1129);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{margin:0 0 12px;font-size:15px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.row{display:grid;grid-template-columns:28px 26px minmax(90px,170px) 1fr 64px 40px 14px;gap:10px;align-items:center;
padding:6px 8px;border-radius:9px;cursor:pointer}
.row:hover{background:var(--panel2)}.row.sel{background:#1d2a66;outline:1px solid var(--acc)}
.pos{color:var(--mute);font-weight:600;text-align:right}
.crest{width:24px;height:24px;object-fit:contain}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bar{height:14px;background:#0a0f26;border-radius:7px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .a{background:linear-gradient(90deg,var(--acc),var(--acc2))}.bar .b{background:#3a4688}
.val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;color:var(--mute);font-size:12px;margin:-4px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.detail .top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.detail .top img{width:56px;height:56px;object-fit:contain}
.detail .top h3{margin:0;font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--panel2);border-radius:10px;padding:9px}.kpi b{font-size:18px;display:block}.kpi small{color:var(--mute);font-size:11px}
.fx{display:grid;grid-template-columns:30px 22px 1fr auto 44px;gap:8px;align-items:center;padding:7px 4px;border-top:1px solid var(--line)}
.fx .md{color:var(--mute);font-size:12px}
.res{font-weight:700;padding:2px 7px;border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums}
.W{background:#123d26;color:var(--win)}.D{background:#252c3d;color:var(--draw)}.L{background:#3f1418;color:var(--loss)}.U{color:var(--mute)}
.opts{text-align:right;font-weight:700}.ha{color:var(--mute);font-size:11px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin-top:18px}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;cursor:pointer;user-select:none;font-size:12px}
th.on{color:var(--acc2)}
td:nth-child(2),th:nth-child(2){text-align:left}
td .t{display:flex;align-items:center;gap:8px}
tbody tr:hover{background:var(--panel2);cursor:pointer}
.heat{border-radius:6px;padding:2px 6px}
.gg{text-align:center;font-variant-numeric:tabular-nums;color:var(--mute)}.gf{color:var(--win)}.ga{color:var(--loss)}
.chev{color:var(--mute)}
.acc{margin:4px 0 10px 36px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.accsum{color:var(--mute);margin-bottom:8px}.accsum b{color:var(--text)}
.acct th,.acct td{padding:6px 8px;font-size:13px}.acct td.rk{color:var(--mute)}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.band{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}.band small{display:block;color:var(--mute);font-size:11px}.band b{font-size:18px}
.acct tr.me td{background:rgba(61,123,255,.22);font-weight:700}.acct tr.me td:first-child{box-shadow:inset 3px 0 var(--acc2)}
.acct tfoot td{border-bottom:0;font-weight:600}
@media(max-width:600px){.card{padding:12px}.row{grid-template-columns:18px 20px minmax(0,1fr) auto 30px 10px;gap:6px;padding:6px 4px}.row .bar{display:none}.acc{margin-left:0}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:inherit;font-weight:600;font-size:15px;padding:10px 14px;cursor:pointer}
.tabs button.on{color:var(--text);border-color:var(--acc2)}
#map{display:grid;gap:18px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.svgwrap svg{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}.mid{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 5}
.qbg{opacity:.06}.tk{fill:var(--mute);font-size:11px}.ax{fill:var(--mute);font-size:12px;font-weight:600}.ql{font-size:13px;font-weight:700;opacity:.9}
.dot{cursor:pointer}.dot .halo{fill:var(--panel);stroke-width:2;opacity:.9}.dot.on .halo{stroke-width:3;fill:var(--panel2)}
.dot:hover .halo{stroke-width:3}
.info{background:var(--panel2);border-radius:12px;padding:14px;display:grid;gap:12px}
.info .top{display:flex;gap:12px;align-items:center}.info .top img{width:48px;height:48px;object-fit:contain}.info h3{margin:0 0 4px;font-size:20px}
.pill{border:1px solid;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.meter .mh{display:flex;justify-content:space-between;margin-bottom:4px}.meter .mh b{font-size:18px}.meter small{color:var(--mute)}
.cm{margin:0;line-height:1.5}
.quads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.q .sub{margin:-6px 0 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:4px 10px 4px 5px;font:inherit;font-size:13px;cursor:pointer}
.chip .crest{width:18px;height:18px}
.hlrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--line);cursor:pointer}
.hlrow small{color:var(--mute)}.hlrow b{text-align:right}
body{background-color:var(--bg);background-image:radial-gradient(1100px 520px at 75% -8%,rgba(46,80,220,.45),transparent 62%),radial-gradient(700px 400px at -5% 20%,rgba(0,170,255,.12),transparent 60%),
radial-gradient(1.2px 1.2px at 12% 18%,rgba(255,255,255,.55),transparent 2px),radial-gradient(1px 1px at 68% 9%,rgba(255,255,255,.45),transparent 2px),radial-gradient(1.4px 1.4px at 88% 31%,rgba(255,255,255,.5),transparent 2px),radial-gradient(1px 1px at 33% 6%,rgba(255,255,255,.4),transparent 2px),radial-gradient(1px 1px at 52% 22%,rgba(255,255,255,.35),transparent 2px);background-repeat:no-repeat;background-attachment:fixed}
h1,.card h2,.stat b,.tabs button,.hc .hl b,.hn,.hm th,.val{font-family:"Barlow Condensed",Inter,system-ui,sans-serif}
h1{font-size:clamp(30px,5.2vw,52px);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1}
h1 span{background:linear-gradient(90deg,#fff 0%,var(--acc2) 45%,var(--acc) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:17px;font-weight:700;letter-spacing:.08em;color:#b9c3f2}
.stat b{font-size:26px;font-weight:700}
.tabs button{font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.card{background:linear-gradient(180deg,rgba(20,28,70,.85),rgba(10,15,40,.9));backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.val{font-size:17px}
#hero{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:12px;margin-bottom:22px}
@media(max-width:960px){#hero{grid-template-columns:repeat(2,minmax(0,1fr))}.hc.big{grid-column:1/-1}}
.hc{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;min-width:0;
background:linear-gradient(160deg,rgba(61,123,255,.22),rgba(15,21,51,.9) 60%);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.hc:hover,.hc:focus-visible{transform:translateY(-2px);border-color:var(--acc2)}
.hc.big{background:linear-gradient(140deg,#2a49d8 0%,#1a2a78 55%,#0f1533 100%);border-color:#4d6dff}
.hc .hl{display:flex;flex-direction:column}.hc .hl b{font-size:16px;text-transform:uppercase;letter-spacing:.05em}.hc .hl small{color:var(--mute);font-size:12px}
.hc.big .hl small{color:#c3ceff}
.hcb{display:flex;align-items:center;gap:10px;min-width:0}.hcb .crest{width:40px;height:40px}.hc.big .hcb .crest{width:56px;height:56px}
.hn{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hc.big .hn{font-size:32px}
.hf{color:var(--mute);font-size:13px}.hc.big .hf{color:#dce3ff}
.scale{display:flex;align-items:center;gap:6px;margin-left:auto}.scale i{width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,hsl(220 85% 22%),hsl(110 85% 37%),hsl(0 85% 52%))}.scale small{color:var(--mute)}
.hmwrap{overflow-x:auto}
.hm{border-collapse:separate;border-spacing:4px;min-width:760px}
.hm th,.hm td{border:0;padding:0;text-align:center}.hm th{font-size:15px;padding-bottom:4px}.hm th small{color:var(--gold);margin-left:2px}
.hm .tl{text-align:left;padding-right:8px;white-space:nowrap}.hm .rk{color:var(--mute);width:22px;font-size:12px}
.hm tbody tr{cursor:pointer}.hm tbody tr:hover .tl{color:var(--acc2)}
.cell{height:40px;min-width:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);border-bottom:4px solid transparent}
.cell .crest{width:20px;height:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.cell.W{border-bottom-color:var(--win)}.cell.D{border-bottom-color:var(--draw)}.cell.L{border-bottom-color:var(--loss)}
.hm .sum{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;padding-left:8px}
@media(prefers-reduced-motion:reduce){.hc{transition:none}}
[hidden]{display:none!important}
h1 #ctitle{background:none;-webkit-text-fill-color:currentColor;color:var(--text)}
#comps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
#comps button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(15,21,51,.7);
font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
#comps button i{width:10px;height:10px;border-radius:50%}
#comps button.on{color:#fff;border-color:var(--acc2);background:linear-gradient(135deg,var(--acc),rgba(15,21,51,.8))}
#comps button:focus-visible{outline:2px solid var(--acc2)}
#err{margin:0 0 16px}
.bar .a{background:linear-gradient(90deg,var(--acc),var(--acc2))}
footer{color:var(--mute);font-size:12px;margin-top:22px}
footer a{color:var(--acc2)}
.err{padding:40px;text-align:center;color:var(--loss)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span id="ctitle">Şampiyonlar Ligi</span> <span>Rakip Gücü</span></h1>
      <div class="sub" id="csub"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav id="comps" aria-label="Turnuva"><button data-c="ucl" class="on"><i style="background:#3d7bff"></i>Şampiyonlar Ligi</button><button data-c="uel"><i style="background:#ff7a1a"></i>Avrupa Ligi</button><button data-c="uecl"><i style="background:#16b364"></i>Konferans Ligi</button></nav>
  <div class="err" id="err" hidden></div>
  <section id="hero" aria-label="Öne çıkanlar"></section>
  <nav class="tabs"><button data-t="list" class="on">Sıralama</button><button data-t="map">Başarı Haritası</button><button data-t="heat">Isı Haritası</button></nav>
  <div id="tab-list">
  <div class="controls">
    <div class="seg" id="metric">
      <button data-m="oppPts" class="on">Rakip puanı</button>
      <button data-m="oppElo">Rakip Elo</button>
      <button data-m="oppGF">Rakip golleri</button>
      <button data-m="oppGD">Rakip averajı</button>
    </div>
    <input type="search" id="q" placeholder="Takım ara…">
  </div>

  <div class="grid">
    <div class="card">
      <h2>Fikstür zorluğu sıralaması</h2><div class="sub" style="margin:-6px 0 10px">Bir takıma dokunun, rakipleri altında açılsın.</div>
      <div class="legend" id="legend"></div>
      <div id="bars"></div>
    </div>
      </div>

  <div class="card tablewrap">
    <h2>Tüm veriler</h2>
    <table><thead id="th"></thead><tbody id="tb"></tbody></table>
  </div>

  </div>
  <div id="map" hidden></div>
  <div id="heat" hidden></div>

  <footer>
        Elo: <a href="https://clubelo.com" target="_blank" rel="noopener">clubelo.com</a> · Veri: <a href="https://www.football-data.org" target="_blank" rel="noopener">football-data.org</a> · <span id="upd"></span>
  </footer>
</div>

<script>
const M = {oppPts:"Rakip puanı",oppElo:"Rakip Elo",oppGF:"Rakip golleri",oppGD:"Rakip averajı"};
let D, byId, metric = "oppPts", sel = null, sortKey = "oppPts", sortDir = -1, q = "";
const $ = s => document.querySelector(s);
const sgn = n => n > 0 ? "+" + n : "" + n;

const COMPS = {
  ucl: { name: "Şampiyonlar Ligi", short: "ŞL", acc: "#3d7bff", acc2: "#00d1ff" },
  uel: { name: "Avrupa Ligi", short: "UEL", acc: "#ff7a1a", acc2: "#ffb648" },
  uecl: { name: "Konferans Ligi", short: "UECL", acc: "#16b364", acc2: "#4be3a0" },
};
let COMP = "ucl", tab = "list";
const cache = {};
const load = (c, n = 0) => cache[c] ? Promise.resolve(cache[c]) : fetch(`data/${c}.json`, { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(d => (cache[c] = d))
  .catch(e => { if (n < 2) return new Promise(res => setTimeout(res, 800)).then(() => load(c, n + 1)); throw e; });
function boot(c) {
  COMP = c; try { localStorage.setItem("comp", c); } catch (e) {}
  const C = COMPS[c], R = document.documentElement.style;
  R.setProperty("--acc", C.acc); R.setProperty("--acc2", C.acc2);
  document.querySelectorAll("#comps button").forEach(b => b.classList.toggle("on", b.dataset.c === c));
  $("#ctitle").textContent = C.name;
  return load(c).then(d => {
    $("#err").hidden = true;
    D = d; byId = Object.fromEntries(d.teams.map(t => [t.id, t]));
    sel = null; mapSel = null; q = ""; $("#q").value = "";
    $("#csub").textContent = `Her takımın lig aşamasındaki ${d.games} rakibinin bu sezon topladığı puan ve goller. Liste ne kadar üstteyse fikstür o kadar zor.`;
    $("#stats").innerHTML = [["Sezon", d.season + "/" + (+d.season + 1 + "").slice(2)], ["Hafta", d.matchday + " / " + d.games], ["Oynanan maç", d.played + " / " + d.total]]
      .map(([k, v]) => `<div class="stat"><small>${k}</small><b>${v}</b></div>`).join("");
    $("#upd").textContent = "Son güncelleme: " + new Date(d.updated).toLocaleString("tr-TR");
    renderHero();
    setTab(tab);
  }).catch(e => { console.error(e); const x = $("#err"); x.hidden = false; x.textContent = `${C.name} verisi yüklenemedi (${e.message}). Sayfayı yenileyin.`; });
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.t));
document.querySelectorAll("#comps button").forEach(b => b.onclick = () => boot(b.dataset.c));
try { tab = localStorage.getItem("tab") || "list"; COMP = localStorage.getItem("comp") || "ucl"; } catch (e) {}
boot(COMPS[COMP] ? COMP : "ucl");


document.querySelectorAll("#metric button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#metric button").forEach(x => x.classList.toggle("on", x === b));
  metric = sortKey = b.dataset.m; sortDir = -1; render();
});
$("#q").oninput = e => { q = e.target.value.toLowerCase(); render(); };

// ---- Başarı Haritası ----
const QD = {
  tr: ["Gerçek başarı", "Zor fikstüre rağmen iyi gidiyor", "var(--win)"],
  tl: ["Fikstürden faydalanan", "İyi gidiyor ama rakipler görece zayıf", "var(--acc2)"],
  br: ["Zorlanan", "Kötü gidiyor ama fikstür de ağır", "var(--gold)"],
  bl: ["Hayal kırıklığı", "Kolay rakiplere rağmen kötü gidiyor", "var(--loss)"],
};
let mapSel = null, scored = null, basis = "pts";
function score() {
  const T = D.teams.filter(t => t.p);
  const nz = (k) => { const v = T.map(k), a = Math.min(...v), b = Math.max(...v); return t => b === a ? 50 : (k(t) - a) / (b - a) * 100; };
  const dN = nz(t => basis === "elo" ? t.oppElo : t.oppPPG), pN = nz(t => t.pts / t.p), gN = nz(t => (t.gf - t.ga) / t.p);
  T.forEach(t => { t.diff = dN(t); t.perf = .7 * pN(t) + .3 * gN(t); t.raw = .75 * t.perf + .25 * t.diff; });
  const sN = nz(t => t.raw); T.forEach(t => t.succ = sN(t));
  const by = k => [...T].sort((a, b) => b[k] - a[k]);
  by("diff").forEach((t, i) => t.diffRank = i + 1);
  by("succ").forEach((t, i) => t.succRank = i + 1);
  T.forEach(t => t.q = (t.perf >= 50 ? "t" : "b") + (t.diff >= 50 ? "r" : "l"));
  return T;
}
const comment = t => {
  const d = t.diffRank, s = t.succRank, gap = t.rank - s;
  let c = `Fikstürü ligin en zor ${d}. fikstürü; ligde ${t.rank}. sırada.`;
  if (gap >= 5) c += ` Fikstür hesaba katılınca ${s}. sıraya çıkıyor — puan tablosu bu takıma haksızlık ediyor.`;
  else if (gap <= -5) c += ` Fikstür hesaba katılınca ${s}. sıraya düşüyor — kolay rakiplerden beslenmiş.`;
  else c += ` Fikstüre göre başarı sırası ${s}., puan tablosuyla uyumlu.`;
  return c;
};
function renderMap() {
  const T = scored = score();
  if (!mapSel) mapSel = T.slice().sort((a, b) => a.succRank - b.succRank)[0].id;
  const W = 640, H = 460, P = { l: 46, r: 16, t: 16, b: 44 };
  const x = v => P.l + v / 100 * (W - P.l - P.r), y = v => H - P.b - v / 100 * (H - P.t - P.b);
  const corner = (k, xx, yy, anchor) => `<text x="${xx}" y="${yy}" text-anchor="${anchor}" class="ql" fill="${QD[k][2]}">${QD[k][0]}</text>`;
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${x(v)}" x2="${x(v)}" y1="${y(0)}" y2="${y(100)}" class="gl"/><line x1="${x(0)}" x2="${x(100)}" y1="${y(v)}" y2="${y(v)}" class="gl"/>
    <text x="${x(v)}" y="${H - P.b + 16}" text-anchor="middle" class="tk">${v}</text><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end" class="tk">${v}</text>`).join("");
  const dots = T.map(t => { const s = t.id === mapSel, r = s ? 15 : 11;
    return `<g class="dot ${s ? "on" : ""}" data-id="${t.id}" transform="translate(${x(t.diff).toFixed(1)},${y(t.perf).toFixed(1)})">
      <circle r="${r + 3}" class="halo" stroke="${QD[t.q][2]}"/>
      <image href="${t.crest}" x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}"/><title>${t.name}</title></g>`; }).join("");
  const t = byId[mapSel];
  $("#map").innerHTML = `
  <div class="card"><h2>Başarı haritası</h2>
    <div class="controls"><span class="sub" style="margin:0">Fikstür zorluğu ölçüsü:</span><div class="seg" id="basis">
      <button data-b="pts" class="${basis === "pts" ? "on" : ""}">Rakip puanı (sahada)</button><button data-b="elo" class="${basis === "elo" ? "on" : ""}">Rakip Elo (kâğıt üstünde)</button></div></div>
    <div class="sub" style="margin:-6px 0 10px">Sağa gittikçe fikstür zorlaşıyor, yukarı çıktıkça takım daha iyi oynuyor. İki değer de 0–100 arası. Bir armaya dokunun.</div>
    <div class="mapgrid">
      <div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fikstür zorluğu ve performans grafiği">
        <rect x="${x(50)}" y="${y(100)}" width="${x(100) - x(50)}" height="${y(50) - y(100)}" class="qbg" fill="var(--win)"/>
        <rect x="${x(0)}" y="${y(50)}" width="${x(50) - x(0)}" height="${y(0) - y(50)}" class="qbg" fill="var(--loss)"/>
        ${grid}
        <line x1="${x(50)}" x2="${x(50)}" y1="${y(0)}" y2="${y(100)}" class="mid"/><line x1="${x(0)}" x2="${x(100)}" y1="${y(50)}" y2="${y(50)}" class="mid"/>
        ${corner("tr", x(100) - 6, y(100) + 16, "end")}${corner("tl", x(0) + 6, y(100) + 16, "start")}
        ${corner("br", x(100) - 6, y(0) - 8, "end")}${corner("bl", x(0) + 6, y(0) - 8, "start")}
        <text x="${(x(0) + x(100)) / 2}" y="${H - 6}" text-anchor="middle" class="ax">Fikstür zorluğu →</text>
        <text transform="translate(14,${(y(0) + y(100)) / 2}) rotate(-90)" text-anchor="middle" class="ax">Kendi performansı →</text>
        ${dots}</svg></div>
      <div class="info">
        <div class="top"><img src="${t.crest}" alt="" onerror="this.style.visibility='hidden'"><div><h3>${t.name}</h3>
          <span class="pill" style="color:${QD[t.q][2]};border-color:${QD[t.q][2]}">${QD[t.q][0]}</span></div></div>
        ${[["Fikstür zorluğu", t.diff, `${t.diffRank}. en zor`], ["Kendi performansı", t.perf, `${t.pts} puan · ${sgn(t.gf - t.ga)} averaj`], ["Fikstüre göre başarı", t.succ, `${t.succRank}. sırada (ligde ${t.rank}.)`]]
          .map(([n, v, s]) => `<div class="meter"><div class="mh"><span>${n}</span><b>${Math.round(v)}</b></div><div class="bar"><i class="a" style="width:${v}%"></i></div><small>${s}</small></div>`).join("")}
        <p class="cm">${comment(t)}</p>
      </div>
    </div>
  </div>
  <div class="quads">${["tr", "tl", "br", "bl"].map(k => { const L = T.filter(t => t.q === k).sort((a, b) => b.succ - a.succ);
    return `<div class="card q"><h2 style="color:${QD[k][2]}">${QD[k][0]} · ${L.length}</h2><div class="sub">${QD[k][1]}</div>
      <div class="chips">${L.map(t => `<button class="chip" data-id="${t.id}">${img(t)}${t.name}</button>`).join("")}</div></div>`; }).join("")}</div>
  <div class="quads">
    ${hl("Puan tablosunun hak vermedikleri", "Fikstür hesaba katılınca en çok yükselenler", [...T].sort((a, b) => (b.rank - b.succRank) - (a.rank - a.succRank)).slice(0, 5), t => `▲ ${t.rank - t.succRank}`, "var(--win)")}
    ${hl("Fikstürle şişenler", "Fikstür hesaba katılınca en çok düşenler", [...T].sort((a, b) => (a.rank - a.succRank) - (b.rank - b.succRank)).slice(0, 5), t => `▼ ${t.succRank - t.rank}`, "var(--loss)")}
  </div>
  <div class="card tablewrap"><h2>Fikstüre göre başarı sıralaması</h2>
    <div class="sub" style="margin:-6px 0 10px">Başarı puanı = %75 kendi performansı + %25 fikstür zorluğu, 0–100 arası. Performans = %70 maç başı puan + %30 maç başı averaj. Fikstür zorluğu, yukarıdaki seçime göre rakiplerin maç başı puanı ya da ortalama Elo puanı.</div>
    <table><thead><tr><th>#</th><th>Takım</th><th>Başarı</th><th></th><th>Performans</th><th>Fikstür</th><th>Lig</th><th>Fark</th></tr></thead><tbody>
    ${[...T].sort((a, b) => a.succRank - b.succRank).map(t => { const g = t.rank - t.succRank;
      return `<tr data-id="${t.id}"><td>${t.succRank}</td><td><span class="t">${img(t)}${t.name}</span></td><td><b>${Math.round(t.succ)}</b></td>
      <td style="min-width:110px"><div class="bar"><i class="a" style="width:${t.succ}%"></i></div></td><td>${Math.round(t.perf)}</td><td>${Math.round(t.diff)}</td><td>${t.rank}</td>
      <td style="color:${g > 0 ? "var(--win)" : g < 0 ? "var(--loss)" : "var(--mute)"}">${g > 0 ? "▲ " + g : g < 0 ? "▼ " + -g : "–"}</td></tr>`; }).join("")}
    </tbody></table></div>`;
  document.querySelectorAll("#basis button").forEach(b => b.onclick = () => { basis = b.dataset.b; renderMap(); });
  document.querySelectorAll("#map [data-id]").forEach(e => e.onclick = () => { mapSel = +e.dataset.id; renderMap(); if (e.tagName !== "g") document.querySelector("#map svg").scrollIntoView({ behavior: "smooth", block: "center" }); });
}
const hl = (h, s, L, f, c) => `<div class="card q"><h2>${h}</h2><div class="sub">${s}</div>
  ${L.map(t => `<div class="hlrow" data-id="${t.id}">${img(t)}<span class="nm">${t.name}</span><small>lig ${t.rank}. → ${t.succRank}.</small><b style="color:${c}">${f(t)}</b></div>`).join("")}</div>`;
function setTab(k) {
  tab = k;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === k));
  $("#tab-list").hidden = k !== "list"; $("#map").hidden = k !== "map"; $("#heat").hidden = k !== "heat";
  if (k === "list") render();
  if (k === "map") renderMap();
  if (k === "heat") renderHeat();
  try { localStorage.setItem("tab", k); } catch (e) {}
}
// ---- Vitrin + Isı haritası ----
let heatBy = "pts";
function renderHero() {
  const T = score();
  const top = (k, dir = -1) => [...T].filter(t => t[k] != null).sort((a, b) => dir * (a[k] - b[k]))[0];
  const surp = [...T].sort((a, b) => (b.rank - b.succRank) - (a.rank - a.succRank))[0];
  const cards = [
    ["En zor fikstür", "sahada", top("oppPts"), t => `Rakipleri ${t.oppPts} puan`],
    ["En zor fikstür", "kâğıt üstünde", top("oppElo"), t => `Rakip Elo ort. ${t.oppElo}`],
    ["En kolay fikstür", "sahada", top("oppPts", 1), t => `Rakipleri ${t.oppPts} puan`],
    ["Fikstüre göre lider", "başarı puanı", T.find(t => t.succRank === 1), t => `Ligde ${t.rank}., fikstüre göre 1.`],
    ["Puan tablosu haksızlık ediyor", "en çok yükselen", surp, t => `Lig ${t.rank}. → ${t.succRank}.`],
  ];
  $("#hero").innerHTML = cards.map(([h, s, t, f], i) => `<button class="hc ${i === 0 ? "big" : ""}" data-id="${t.id}">
    <span class="hl"><b>${h}</b><small>${s}</small></span>
    <span class="hcb">${img(t)}<span class="hn">${t.name}</span></span><span class="hf">${f(t)}</span></button>`).join("");
  document.querySelectorAll("#hero .hc").forEach(b => b.onclick = () => { setTab("list"); sel = +b.dataset.id; render(); document.querySelector(".row.sel")?.scrollIntoView({ behavior: "smooth", block: "center" }); });
}
function renderHeat() {
  const T = [...D.teams].sort((a, b) => heatBy === "elo" ? b.oppElo - a.oppElo : b.oppPts - a.oppPts);
  const val = o => heatBy === "elo" ? o.elo : o.pts;
  const all = D.teams.map(val), lo = Math.min(...all), hi = Math.max(...all);
  const col = v => { const x = (v - lo) / (hi - lo || 1); return `hsl(${220 - x * 220} 85% ${22 + x * 30}%)`; };
  const res = f => !f.done ? "" : f.gf > f.ga ? "W" : f.gf === f.ga ? "D" : "L";
  $("#heat").innerHTML = `<div class="card">
    <h2>Fikstür ısı haritası</h2>
    <div class="controls"><span class="sub" style="margin:0">Hücre rengi:</span><div class="seg" id="heatby">
      <button data-h="pts" class="${heatBy === "pts" ? "on" : ""}">Rakibin puanı</button><button data-h="elo" class="${heatBy === "elo" ? "on" : ""}">Rakibin Elo'su</button></div>
      <span class="scale"><small>Zayıf</small><i></i><small>Güçlü</small></span></div>
    <div class="sub" style="margin:-4px 0 12px">Her satır bir takımın 8 haftalık fikstürü. Kırmızıya döndükçe rakip güçleniyor. Alt çizgi sonucu gösteriyor: yeşil galibiyet, gri beraberlik, kırmızı mağlubiyet.</div>
    <div class="hmwrap"><table class="hm"><thead><tr><th></th><th class="tl">Takım</th>${Array.from({ length: D.games }, (_, i) => i + 1).map(m => `<th>H${m}${m <= D.matchday ? "" : "<small>•</small>"}</th>`).join("")}<th>${heatBy === "elo" ? "Ort." : "Top."}</th></tr></thead><tbody>
    ${T.map((t, i) => `<tr data-id="${t.id}"><td class="rk">${i + 1}</td><td class="tl"><span class="t">${img(t)}${t.name}</span></td>
      ${t.fixtures.map(f => { const o = byId[f.opp], v = val(o);
        return `<td><div class="cell ${res(f)}" style="background:${col(v)}" title="H${f.md} ${f.home ? "İç" : "Dış"}: ${o.name} (${v})${f.done ? " " + f.gf + "-" + f.ga : ""}">
          ${img(o)}<span>${v}</span></div></td>`; }).join("")}
      <td class="sum">${heatBy === "elo" ? t.oppElo : t.oppPts}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  document.querySelectorAll("#heatby button").forEach(b => b.onclick = () => { heatBy = b.dataset.h; renderHeat(); });
  document.querySelectorAll("#heat tbody tr").forEach(r => r.onclick = () => { setTab("list"); sel = +r.dataset.id; render(); document.querySelector(".row.sel")?.scrollIntoView({ behavior: "smooth", block: "center" }); });
}
function render() { bars(); detail(); table(); }

function bars() {
  const list = [...D.teams].sort((a, b) => b[metric] - a[metric] || b.oppPts - a.oppPts);
  const vals = list.map(t => t[metric]), mn = metric === "oppElo" ? Math.min(...vals) - 40 : Math.min(0, ...vals), mx = Math.max(...vals, 0);
  const span = mx - mn || 1;
  $("#legend").innerHTML = `<span style="margin-left:auto">Rakip gol: <b style="color:var(--win)">A</b> : <b style="color:var(--loss)">Y</b></span>`;
  $("#bars").innerHTML = list.map((t, i) => {
    if (q && !t.name.toLowerCase().includes(q)) return "";
    const v = t[metric], a = (v - mn) / span * 100, b = 0;
    const open = t.id === sel;
    return `<div class="row ${open ? "sel" : ""}" data-id="${t.id}">
      <span class="pos">${i + 1}</span>${img(t)}
      <span class="nm">${t.name}</span>
      <div class="bar"><i class="a" style="width:${a}%"></i><i class="b" style="width:${b}%"></i></div>
      <span class="gg"><b class="gf">${t.oppGF}</b>:<b class="ga">${t.oppGA}</b></span>
      <span class="val">${metric === "oppGD" ? sgn(v) : v}</span><span class="chev">${open ? "▾" : "▸"}</span></div>
      ${open ? acc(t) : ""}`;
  }).join("");
  document.querySelectorAll(".row").forEach(r => r.onclick = () => { const id = +r.dataset.id; sel = sel === id ? null : id; render(); });
}
const BANDS = [[1, 8], [9, 16], [17, 24], [25, 36]];
const dist = t => BANDS.map(([a, b]) => t.fixtures.filter(f => { const r = byId[f.opp].rank; return r >= a && r <= b; }).length);
const img = t => `<img class="crest" src="${t.crest}" alt="" onerror="this.style.visibility='hidden'" loading="lazy">`;

function acc(t) {
  const rows = [...t.fixtures, { self: true }].sort((x, y) => (x.self ? t : byId[x.opp]).rank - (y.self ? t : byId[y.opp]).rank);
  const pos = rows.findIndex(f => f.self) + 1;
  const fx = rows.map(f => {
    if (f.self) return `<tr class="me"><td class="rk">${t.rank}.</td><td><span class="t">${img(t)}${t.name}</span></td>
      <td class="ha" colspan="2">Fikstüründe ${pos}. / ${D.games + 1}</td><td>${t.elo ?? "–"}</td><td><b>${t.pts}</b></td><td class="gf">${t.gf}</td><td class="ga">${t.ga}</td><td>${sgn(t.gf - t.ga)}</td></tr>`;
    const o = byId[f.opp];
    const r = !f.done ? ["U", "Oynanmadı"] : f.gf > f.ga ? ["W", f.gf + "-" + f.ga] : f.gf === f.ga ? ["D", f.gf + "-" + f.ga] : ["L", f.gf + "-" + f.ga];
    return `<tr><td class="rk">${o.rank}.</td><td><span class="t">${img(o)}${o.name}</span></td>
      <td class="ha">${f.home ? "İç" : "Dış"} · H${f.md}</td><td><span class="res ${r[0]}">${r[1]}</span></td>
      <td>${o.elo ?? "–"}</td><td><b>${o.pts}</b></td><td class="gf">${o.gf}</td><td class="ga">${o.ga}</td><td>${sgn(o.gf - o.ga)}</td></tr>`;
  }).join("");
  return `<div class="acc">
    <div class="accsum">${t.name}: lig sırası <b>${t.rank}.</b> · ${t.pts} puan · ${t.w}G ${t.d}B ${t.l}M ·
      rakip maç başı <b>${t.oppPPG.toFixed(2)}</b> puan · kendi fikstüründe <b>${pos}. / ${D.games + 1}</b></div>
    <div class="bands">${dist(t).map((n, i) => `<span class="band"><small>${BANDS[i][0]}-${BANDS[i][1]}. sıra</small><b>${n}</b></span>`).join("")}</div>
    <div style="overflow-x:auto"><table class="acct"><thead><tr><th>Sıra</th><th>Rakip</th><th>Maç</th><th>Sonuç</th><th>Elo</th><th>Puan</th><th>A</th><th>Y</th><th>Av</th></tr></thead>
    <tbody>${fx}</tbody><tfoot><tr><td></td><td>Toplam</td><td></td><td></td><td title="Ortalama">ø ${t.oppElo ?? "–"}</td><td><b>${t.oppPts}</b></td><td class="gf">${t.oppGF}</td><td class="ga">${t.oppGA}</td><td>${sgn(t.oppGD)}</td></tr></tfoot></table></div></div>`;
}
function detail() {}

const COLS = [["#", null], ["Takım", null], ["Lig", "rank"], ["P", "pts"], ["Elo", "elo"], ["Rakip P", "oppPts"], ["Rakip Elo", "oppElo"],
  ["Rakip MBP", "oppPPG"], ["1-8", null], ["9-16", null], ["17-24", null], ["25-36", null], ["Rakip A", "oppGF"], ["Rakip Y", "oppGA"], ["Rakip Av", "oppGD"]];
function table() {
  const list = [...D.teams].sort((a, b) => sortDir * (a[sortKey] - b[sortKey]));
  const ext = k => { const v = D.teams.map(t => t[k]); return [Math.min(...v), Math.max(...v)]; };
  const heat = {}; ["oppPts", "oppElo", "oppPPG", "oppGF", "oppGD"].forEach(k => heat[k] = ext(k));
  $("#th").innerHTML = "<tr>" + COLS.map(([n, k]) => `<th data-k="${k || ""}" class="${k === sortKey ? "on" : ""}">${n}${k === sortKey ? (sortDir < 0 ? " ▼" : " ▲") : ""}</th>`).join("") + "</tr>";
  $("#tb").innerHTML = list.filter(t => !q || t.name.toLowerCase().includes(q)).map((t, i) => {
    const c = k => { if (!heat[k]) return ""; const [a, b] = heat[k], x = (t[k] - a) / (b - a || 1); return `style="background:rgba(61,123,255,${(x * .55).toFixed(2)})"`; };
    return `<tr data-id="${t.id}"><td>${i + 1}</td><td><span class="t"><img class="crest" src="${t.crest}" alt="" onerror="this.style.visibility='hidden'">${t.name}</span></td>
      <td>${t.rank}</td><td>${t.pts}</td><td>${t.elo ?? "–"}</td><td><span class="heat" ${c("oppPts")}>${t.oppPts}</span></td><td><span class="heat" ${c("oppElo")}>${t.oppElo ?? "–"}</span></td><td><span class="heat" ${c("oppPPG")}>${t.oppPPG.toFixed(2)}</span></td>
      ${dist(t).map((n, j) => `<td><span class="heat" style="background:rgba(61,123,255,${(n / 4 * .55).toFixed(2)})">${n}</span></td>`).join("")}
      <td><span class="heat" ${c("oppGF")}>${t.oppGF}</span></td><td>${t.oppGA}</td><td><span class="heat" ${c("oppGD")}>${sgn(t.oppGD)}</span></td></tr>`;
  }).join("");
  document.querySelectorAll("#th th").forEach(th => th.onclick = () => {
    const k = th.dataset.k; if (!k) return;
    sortDir = k === sortKey ? -sortDir : (k === "rank" ? 1 : -1); sortKey = k; table();
  });
  document.querySelectorAll("#tb tr").forEach(r => r.onclick = () => { sel = +r.dataset.id; render(); scrollTo({ top: 0, behavior: "smooth" }); });
}
</script>
</body>
</html>
